apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  labels:
    app.kubernetes.io/name: backend
    tier: backend
spec:
  type: ClusterIP                 # internal only, never NodePort or LoadBalancer
  selector:
    app.kubernetes.io/name: backend
    tier: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
