apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  labels:
    app.kubernetes.io/name: frontend
    tier: frontend
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: frontend
    tier: frontend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080             # dev port; the prod overlay patches it to 30081
