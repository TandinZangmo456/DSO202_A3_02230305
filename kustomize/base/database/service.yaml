apiVersion: v1
kind: Service
metadata:
  name: db-svc
  labels:
    app.kubernetes.io/name: db
    tier: database
spec:
  clusterIP: None                 # headless: reachable only inside the cluster
  selector:
    app.kubernetes.io/name: db
    tier: database
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
