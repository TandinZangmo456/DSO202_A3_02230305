# Dev sizing: one replica per tier.
# Steady state: requests 175m CPU / 352Mi, limits 850m CPU / 704Mi.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tier-quota
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 1536Mi
    pods: "10"
    persistentvolumeclaims: "2"
    requests.storage: 2Gi
    services.nodeports: "1"       # only the frontend may be a NodePort
    services.loadbalancers: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-limits
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 200m
        memory: 128Mi
      min:
        cpu: 10m
        memory: 16Mi
      max:                        # the database is the largest container in dev
        cpu: 500m
        memory: 512Mi
